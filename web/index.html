<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CO2 Monitor</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{height:100vh;overflow:hidden;display:flex;flex-direction:column;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f0f1a;color:#e0e0e0}
.top{height:48px;display:flex;align-items:center;padding:0 12px;gap:10px;background:#1a1a2e;border-bottom:1px solid #2a2a3e;flex-shrink:0}
.co2-box{display:flex;align-items:baseline;gap:6px}
.co2-val{font-size:28px;font-weight:700;color:#00d68f;line-height:1}
.co2-unit{font-size:12px;color:#888}
.co2-status{font-size:11px;padding:2px 6px;border-radius:3px;background:#00d68f22;color:#00d68f;margin-left:4px}
.online-dot{width:8px;height:8px;border-radius:50%;background:#00d68f;margin-left:6px;flex-shrink:0}
.online-dot.off{background:#ff3d71}
.pills{display:flex;gap:6px;margin-left:auto}
.pill{background:#1e1e32;border:1px solid #2a2a3e;border-radius:4px;padding:2px 8px;font-size:11px;white-space:nowrap}
.pill b{color:#00d68f;margin-right:3px}
.chart-wrap{flex:1;position:relative;min-height:0}
.chart-wrap canvas{position:absolute;top:0;left:0;width:100%!important;height:100%!important}
.foot{height:20px;display:flex;align-items:center;padding:0 12px;gap:14px;font-size:10px;color:#666;background:#1a1a2e;border-top:1px solid #2a2a3e;flex-shrink:0}
.foot .ok{color:#00d68f}.foot .err{color:#ff3d71}
</style>
</head>
<body>
<div class="top">
  <div class="co2-box">
    <span class="co2-val" id="co2v">--</span>
    <span class="co2-unit">ppm</span>
    <span class="co2-status" id="co2s">--</span>
    <span class="online-dot" id="onlineDot"></span>
  </div>
  <div class="pills">
    <div class="pill"><b id="pTemp">--</b>&deg;C</div>
    <div class="pill"><b id="pHum">--</b>%</div>
    <div class="pill"><b id="pTrend">--</b></div>
    <div class="pill">conf <b id="pConf">--</b></div>
    <div class="pill">err <b id="pErr">--</b></div>
    <div class="pill">slope <b id="pSlope">--</b></div>
  </div>
</div>
<div class="chart-wrap"><canvas id="c"></canvas></div>
<div class="foot">
  <span>MQTT: <span id="mqSt">--</span></span>
  <span>心跳: <span id="hbSt">--</span></span>
  <span id="alarmSt">无报警</span>
  <span id="updSt">--</span>
</div>
<script>
'use strict';
const API='';
let chart,ws,wsRetry=0;

function co2Color(v){return v>1500?'#ff3d71':v>1000?'#ffaa00':'#00d68f'}

function initChart(){
  const ctx=document.getElementById('c').getContext('2d');
  chart=new Chart(ctx,{type:'line',data:{labels:[],datasets:[
    {label:'CO2 实际',data:[],borderColor:'#4fc3f7',backgroundColor:'rgba(79,195,247,0.05)',borderWidth:1.5,fill:true,tension:0.3,pointRadius:0},
    {label:'CO2 预测',data:[],borderColor:'#ffaa00',borderWidth:1.5,borderDash:[5,3],fill:false,tension:0.3,pointRadius:0}
  ]},options:{responsive:true,maintainAspectRatio:false,animation:{duration:300},
    interaction:{intersect:false,mode:'index'},
    scales:{x:{ticks:{color:'#555',maxTicksLimit:8,font:{size:9}},grid:{color:'rgba(255,255,255,0.04)'}},
            y:{ticks:{color:'#555',font:{size:9}},grid:{color:'rgba(255,255,255,0.04)'}}},
    plugins:{legend:{labels:{color:'#888',font:{size:9},boxWidth:12,padding:6}}}}});
}

function updateUI(d,online){
  const co2=d.co2||d.filt||0;
  const el=document.getElementById('co2v');
  el.textContent=Math.round(co2);
  el.style.color=co2Color(co2);
  const s=document.getElementById('co2s');
  if(co2>1500){s.textContent='危险';s.style.color='#ff3d71';s.style.background='#ff3d7122'}
  else if(co2>1000){s.textContent='偏高';s.style.color='#ffaa00';s.style.background='#ffaa0022'}
  else{s.textContent='正常';s.style.color='#00d68f';s.style.background='#00d68f22'}
  const dot=document.getElementById('onlineDot');
  dot.className='online-dot'+(online?'':' off');
  document.getElementById('pTemp').textContent=d.temp!=null?d.temp.toFixed(1):'--';
  document.getElementById('pHum').textContent=d.hum!=null?d.hum.toFixed(0):'--';
  document.getElementById('pTrend').textContent=d.trend||'--';
  document.getElementById('pConf').textContent=d.conf!=null?(d.conf>1?d.conf.toFixed(0):(d.conf*100).toFixed(0))+'%':'--';
  document.getElementById('pSlope').textContent=d.slope!=null?d.slope.toFixed(2):'--';
  if(d.alarm){document.getElementById('alarmSt').textContent='报警!';document.getElementById('alarmSt').style.color='#ff3d71'}
  else{document.getElementById('alarmSt').textContent='无报警';document.getElementById('alarmSt').style.color=''}
  document.getElementById('updSt').textContent='更新: '+new Date().toLocaleTimeString();
}
async function fetchRealtime(){
  try{
    const r=await fetch(API+'/api/v1/realtime/co2');
    const j=await r.json();
    updateUI(j.data,j.online!==false);
  }catch(e){console.warn('realtime err',e)}
}

async function fetchHistory(){
  try{
    const r=await fetch(API+'/api/v1/history/co2?range=1h');
    const j=await r.json();
    const pts=j.points||[];
    chart.data.labels=pts.map(p=>new Date(p.ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}));
    chart.data.datasets[0].data=pts.map(p=>p.co2);
    chart.update('none');
  }catch(e){console.warn('history err',e)}
}

async function fetchPrediction(){
  try{
    const r=await fetch(API+'/api/v1/predict/co2');
    const j=await r.json();
    if(j.prediction&&j.prediction.points){
      const pp=j.prediction.points;
      const labels=chart.data.labels.slice();
      const actual=chart.data.datasets[0].data.slice();
      const pred=new Array(actual.length).fill(null);
      const now=new Date();
      pp.forEach((p,i)=>{
        const future=new Date(now.getTime()+(i+1)*60000);
        const lbl=future.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
        labels.push(lbl);actual.push(null);pred.push(p.co2);
      });
      chart.data.labels=labels;
      chart.data.datasets[0].data=actual;
      chart.data.datasets[1].data=pred;
      chart.update('none');
    }
    if(j.confidence!=null)document.getElementById('pConf').textContent=(j.confidence>1?j.confidence.toFixed(0):(j.confidence*100).toFixed(0))+'%';
    if(j.error&&j.error.mae!=null)document.getElementById('pErr').textContent='±'+j.error.mae+'ppm';
    if(j.trend)document.getElementById('pTrend').textContent=j.trend;
  }catch(e){console.warn('predict err',e)}
}

async function fetchHealth(){
  try{
    const r=await fetch(API+'/api/v1/health');
    const j=await r.json();
    const mq=document.getElementById('mqSt');
    mq.textContent=j.mqtt?'在线':'离线';
    mq.className=j.mqtt?'ok':'err';
    if(j.lastHeartbeat){
      const ago=Math.round((Date.now()-j.lastHeartbeat)/1000);
      document.getElementById('hbSt').textContent=ago+'s前';
    }
  }catch(e){document.getElementById('mqSt').textContent='错误';document.getElementById('mqSt').className='err'}
}
function connectWS(){
  const proto=location.protocol==='https:'?'wss:':'ws:';
  const url=proto+'//'+location.host+'/ws/realtime';
  try{
    ws=new WebSocket(url);
    ws.onopen=()=>{wsRetry=0;console.log('WS connected')};
    ws.onmessage=(ev)=>{
      try{
        const msg=JSON.parse(ev.data);
        if(msg.type==='realtime'&&msg.data)updateUI(msg.data,true);
      }catch(e){}
    };
    ws.onclose=()=>{
      const delay=Math.min(1000*Math.pow(2,wsRetry),30000);
      wsRetry++;
      setTimeout(connectWS,delay);
    };
    ws.onerror=()=>{ws.close()};
  }catch(e){setTimeout(connectWS,5000)}
}

(function boot(){
  initChart();
  fetchRealtime();
  fetchHistory();
  fetchPrediction();
  fetchHealth();
  connectWS();
  setInterval(fetchRealtime,5000);
  setInterval(fetchHistory,60000);
  setInterval(fetchHealth,15000);
  setInterval(fetchPrediction,60000);
})();
</script>
</body>
</html>
